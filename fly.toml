app = "footdraw-ubong"
primary_region = "yyz"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "footdraw_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # never suspend: suspending freezes timers + websockets mid-match
  auto_start_machines = true
  min_machines_running = 1
