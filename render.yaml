services:
  - type: web
    name: footdraw
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
# For chip balances that survive redeploys, use a paid plan and add:
#    disk: { name: footdraw-data, mountPath: /data, sizeGB: 1 }
#    and env DATA_DIR=/data
